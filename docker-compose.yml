services:
  mini-chatgpt:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mini-chatgpt
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    volumes:
      # Mount docs and index so document uploads/re-indexing persist
      - ./rag/docs:/app/rag/docs
      - ./rag/index:/app/rag/index

