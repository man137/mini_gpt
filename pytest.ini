[pytest]
testpaths = scratch_gpt/tests rag/tests backend/tests eval
addopts = -q -m "not rag_integration and not eval_integration"
markers =
    rag_integration: needs the bge embedding model + a built RAG index (network)
    eval_integration: needs a served LLM backend to score (deselect with -m "not eval_integration")
filterwarnings =
    ignore::DeprecationWarning
